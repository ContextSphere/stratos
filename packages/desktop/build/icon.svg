<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Subtle top-down gradient for 3D depth -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <!-- Soft glow behind white elements -->
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with gradient -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Layers drawn back-to-front; each has a filled interior to occlude layers behind -->
  <g filter="url(#glow)">
    <!-- Layer 3 (bottom/back) -->
    <polygon points="312,570 512,462 712,570 512,652"
      fill="url(#bg)" stroke="#fff" stroke-width="22" stroke-linejoin="miter"/>

    <!-- Layer 2 (middle) -->
    <polygon points="312,448 512,340 712,448 512,530"
      fill="url(#bg)" stroke="#fff" stroke-width="22" stroke-linejoin="miter"/>

    <!-- Layer 1 (top/front) -->
    <polygon points="312,326 512,218 712,326 512,408"
      fill="url(#bg)" stroke="#fff" stroke-width="22" stroke-linejoin="miter"/>
  </g>

  <!-- Terminal prompt: > _ -->
  <g filter="url(#glow)">
    <polyline points="310,720 358,762 310,804"
      fill="none" stroke="#fff" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="376" y1="804" x2="476" y2="804"
      stroke="#fff" stroke-width="18" stroke-linecap="square"/>
  </g>
</svg>
