appId: com.stratos.desktop
productName: Stratos

directories:
  buildResources: build
  output: dist

files:
  - "out/**/*"
  - "package.json"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/arm64-linux"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/x64-linux"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/x64-win32"

asarUnpack:
  - "node_modules/@anthropic-ai/claude-agent-sdk/**"
  - "node_modules/@img/**"
  - "node_modules/@openai/codex/**"
  - "node_modules/@openai/codex-sdk/**"
  - "node_modules/@openai/codex-darwin-arm64/**"
  - "node_modules/@openai/codex-darwin-x64/**"

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
