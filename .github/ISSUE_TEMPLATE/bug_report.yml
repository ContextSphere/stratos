name: Bug Report
description: Report a bug in Stratos
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open Stratos
        2. ...
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@stratosapp/desktop"
        - "@stratosapp/ui"
        - "@stratosapp/core"
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Stratos version
      placeholder: e.g. 0.0.2
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs, OS version, or anything else that helps.
