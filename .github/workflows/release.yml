name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-macos:
    name: Build and Upload macOS Release
    runs-on: macos-latest
    environment: production
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify desktop version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./packages/desktop/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match packages/desktop/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Prepare macOS signing credentials
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            MACOS_CERTIFICATE_P12_BASE64
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_TEAM_ID
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required secret: $var"
              exit 1
            fi
          done

          CERT_PATH="$RUNNER_TEMP/stratos-signing-cert.p12"
          CERT_PATH="$CERT_PATH" node -e "require('fs').writeFileSync(process.env.CERT_PATH, Buffer.from(process.env.MACOS_CERTIFICATE_P12_BASE64, 'base64'))"

          echo "CSC_LINK=$CERT_PATH" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${MACOS_CERTIFICATE_PASSWORD:-}" >> "$GITHUB_ENV"

      - name: Build and package macOS app
        run: |
          pnpm --filter @stratosapp/desktop build
          pnpm --filter @stratosapp/desktop exec electron-builder --mac --publish never

      - name: Generate checksums
        working-directory: packages/desktop/dist
        run: shasum -a 256 *.dmg > checksums.txt

      - name: Publish GitHub release artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/checksums.txt
